<!DOCTYPE html>
<html>

<head>
    <title>Fantrax Linker</title>
    <!-- 
      This <style> block dictates the look of the tiny popup window 
      that appears when you click the extension icon in Chrome's toolbar. 
      It is entirely separate from the styles.css file (which handles 
      the injected buttons on the actual Fantrax page). 
    -->
    <style>
        body {
            width: 200px;
            padding: 10px;
            font-family: sans-serif;
            background-color: #f8f9fa;
        }

        h1 {
            font-size: 16px;
            margin-top: 0;
            color: #333;
        }

        .status {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .legend {
            font-size: 12px;
            border-top: 1px solid #ddd;
            padding-top: 8px;
        }

        .item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        /* Every logo gets the same box so the labels line up */
        .logo {
            width: 18px;
            height: 10px;
            object-fit: contain;
            margin-right: 8px;
        }

    </style>
</head>

<body>
    <!-- Main Title -->
    <h1>Fantrax Linker</h1>
    
    <!-- Status message -->
    <div class="status">Extension is active.</div>
    
    <!-- Legend explaining what the icons mean -->
    <div class="legend">
        <div class="item">
            <img class="logo" src="icons/fangraphs.png" alt="">
            <span>Fangraphs</span>
        </div>
        <div class="item">
            <img class="logo" src="icons/savant.png" alt="">
            <span>Baseball Savant</span>
        </div>
        <div class="item">
            <img class="logo" src="icons/bbref.png" alt="">
            <span>Baseball-Reference</span>
        </div>
    </div>

    <!-- Version Display -->
    <div style="font-size: 10px; color: #999; text-align: right; margin-top: 12px; border-top: 1px solid #eee; padding-top: 6px;">
        v5.1
    </div>
</body>

</html>
